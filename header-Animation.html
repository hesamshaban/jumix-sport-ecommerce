        .wraper-header-anime{

            position: relative;
            max-width: 100vw;
            overflow:hidden;
            /* height: 1200px; */
            .movment{
                transition: 2s;
                height: 700px;
                position: relative;
                .alaki{
                    visibility: hidden;
                }
            }
            .header-main{
                position: absolute;
                width: 100%;
            }
            .header-main:nth-child(1){
                right: -100%;
                z-index: 2;
            }
            .header-main:nth-child(2){
                right: -200%;
                z-index: 3;

            }
            .header-main:nth-child(3){
                right: -300%;
                z-index: 4;
            }
        }
        .button{
            position: fixed;
            padding: 20px;
            z-index: 10;
            top: 25%;
            border-radius: 100%;
            background-color: black;
            border: 1px solid white;
            color: white;
            font-size: 20px;
        }
        .next{

        }
        .prenios{
